[package]
name = "atlas"
description = "Atlas — a self-hosted Jira-equivalent with GitHub, Claude Code and Gemini integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "atlas"
path = "src/lib.rs"

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
hkdf.workspace = true
figment.workspace = true
fractional_index.workspace = true
futures-util.workspace = true
garde.workspace = true
hex.workspace = true
hmac.workspace = true
process-wrap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-swagger-ui.workspace = true
uuid.workspace = true
zeroize.workspace = true
sysinfo.workspace = true

[dev-dependencies]
proptest.workspace = true
# `test` unlocks figment::Jail, which sandboxes env vars + cwd so config tests
# cannot leak into each other (they run on threads in a shared process).
figment = { workspace = true, features = ["test"] }

[lints]
workspace = true
