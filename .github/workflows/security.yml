name: Security

# A secret scan (`TODO.md` Phase 20) over every commit a push or PR brings in. Dependency
# audits are deliberately NOT here: CI's "Security audit" job already runs `cargo audit` and
# `npm audit`, non-blocking by design until the advisory backlog is at zero (see ci.yml). A
# leaked key, unlike an advisory, is never backlog — so this one blocks.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: a secret committed and then deleted is still published.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
