[workspace]
members = ["backend"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
authors = ["Alastair Rayner"]
repository = "https://github.com/Alli1223/Atlas"
publish = false

# ---------------------------------------------------------------------------
# Every third-party version lives here and is referenced from member crates as
# `dep.workspace = true`. Versions were verified against crates.io on
# 2026-07-16 — see docs/research/rust-stack.md. Do not bump casually: sqlx 0.9
# and axum 0.8 both carry breaking changes that most published examples predate.
# ---------------------------------------------------------------------------
[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-extra = { version = "0.12.6", features = [
  "cookie",
  "cookie-private",
  "typed-header",
] }
tokio = { version = "1.52.4", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = [
  "trace",
  "cors",
  "request-id",
  "timeout",
  "limit",
  "compression-gzip",
  "catch-panic",
  "fs",
] }
# `sqlite-bundled`, NOT `sqlite`: in 0.9 the `sqlite` feature also pulls
# sqlite-load-extension / sqlite-deserialize / sqlite-unlock-notify, which drag
# in unsafe extension loading we have no use for.
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-none",
  "sqlite-bundled",
  "macros",
  "migrate",
  "chrono",
  "uuid",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
anyhow = "1.0.103"
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
# 0.5.3 is the current STABLE; 0.6 is still an RC. Note the transitive
# consequence: 0.5.3 pulls password-hash 0.5, whose rand_core is 0.6 — so
# `SaltString::generate` needs `argon2::password_hash::rand_core::OsRng`, which
# is a DIFFERENT type from rand 0.9/0.10's OsRng. See docs/research/rust-stack.md.
argon2 = { version = "0.5.3", features = ["std"] }
# SHA-256 for session-token digests, and as the HKDF hash below. 0.11, not
# 0.10: hkdf 0.13 (via hmac 0.13) needs digest 0.11's `EagerHash`, and a 0.10
# sha2 alongside it is two incompatible `Sha256` types that do not typecheck
# against each other — verified against the registry while wiring the vault,
# not assumed from docs/research/rust-stack.md's July dating. (A pending
# dependabot PR, `dependabot/cargo/sha2-0.11.0`, makes the same bump alone;
# this supersedes it.)
sha2 = "0.11"
# Constant-time equality for anything derived from a secret.
subtle = "2"
# XChaCha20-Poly1305 for the secrets vault (Phase 11): the 192-bit nonce is
# safe to pick randomly forever, unlike AES-GCM's 96-bit one. `getrandom` for
# `Nonce::generate()` — the aead 0.6 API (see docs/research/rust-stack.md #5;
# `generate_key(&mut OsRng)` was removed in the June 2026 aead 0.6 release).
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
# HKDF-SHA256: derives per-purpose subkeys from the one 32-byte master key.
# Not Argon2 — that's for low-entropy passwords, and a random master key is
# already uniform, so a memory-hard KDF would only add latency.
hkdf = "0.13.0"
# Zeroizes secret material on drop; backs `vault::Secret<T>`.
zeroize = { version = "1.9.0", features = ["derive"] }
base64 = "0.22.1"
# Only for cookie `Max-Age`: `cookie` 0.18 (via axum-extra) speaks time::Duration,
# not std::time::Duration. Cargo unifies this with axum-extra's own copy.
time = "0.3.53"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
garde = { version = "0.23.0", features = ["derive"] }
fractional_index = { version = "2.0.2", features = ["serde"] }
figment = { version = "0.10", features = ["env", "toml"] }
proptest = "1.8"
# System telemetry (CPU, memory, disk) for the admin settings page.
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
# Outbound HTTP client used to poll GitHub Releases for update checks.
# rustls-tls: pure-Rust TLS so no OpenSSL build dep is introduced.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ---------------------------------------------------------------------------
# Lints. Inherited by members via `[lints] workspace = true`.
# Kept pragmatic: this must pass `cargo clippy --all-targets -- -D warnings`.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Deny the footguns that matter for a server that must not panic on user input.
unwrap_used = "warn"
# Noise from pedantic that costs more than it catches.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
