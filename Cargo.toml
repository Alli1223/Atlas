[workspace]
members = ["backend"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
authors = ["Alastair Rayner"]
repository = "https://github.com/Alli1223/Atlas"
publish = false

# ---------------------------------------------------------------------------
# Every third-party version lives here and is referenced from member crates as
# `dep.workspace = true`. Versions were verified against crates.io on
# 2026-07-16 — see docs/research/rust-stack.md. Do not bump casually: sqlx 0.9
# and axum 0.8 both carry breaking changes that most published examples predate.
# ---------------------------------------------------------------------------
[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-extra = { version = "0.12.6", features = [
  "cookie",
  "cookie-private",
  "typed-header",
] }
tokio = { version = "1.52.4", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = [
  "trace",
  "cors",
  "request-id",
  "timeout",
  "limit",
  "compression-gzip",
  "catch-panic",
  "fs",
] }
# `sqlite-bundled`, NOT `sqlite`: in 0.9 the `sqlite` feature also pulls
# sqlite-load-extension / sqlite-deserialize / sqlite-unlock-notify, which drag
# in unsafe extension loading we have no use for.
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-none",
  "sqlite-bundled",
  "macros",
  "migrate",
  "chrono",
  "uuid",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
anyhow = "1.0.103"
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
# 0.5.3 is the current STABLE; 0.6 is still an RC. Note the transitive
# consequence: 0.5.3 pulls password-hash 0.5, whose rand_core is 0.6 — so
# `SaltString::generate` needs `argon2::password_hash::rand_core::OsRng`, which
# is a DIFFERENT type from rand 0.9/0.10's OsRng. See docs/research/rust-stack.md.
argon2 = { version = "0.5.3", features = ["std"] }
# SHA-256 for session-token digests. Session ids are hashed before storage.
sha2 = "0.10"
# HMAC-SHA256 for GitHub webhook signature verification (Phase 12). Pinned to
# 0.12 (digest 0.10) to share `sha2 = 0.10` with the session-token digests —
# hmac 0.13 pulls digest 0.11 and would fork the sha2 tree. `Mac::verify_slice`
# is itself constant-time; `subtle` covers the per-repo secret lookup.
hmac = "0.12"
# Hex decoding of the `sha256=` webhook signature header.
hex = "0.4"
# Constant-time equality for anything derived from a secret.
subtle = "2"
base64 = "0.22.1"
# Secrets vault (Phase 11). XChaCha20-Poly1305 AEAD: the 192-bit nonce is safe to
# pick at random forever, so no nonce-reuse bookkeeping. aead 0.6 API — see
# docs/research/rust-stack.md § encryption and corrections.md. `getrandom` gates
# random nonce generation.
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
# HKDF-SHA256 derives per-purpose subkeys from the one master key, so the master
# key is never used to encrypt directly and can key other purposes later. Pinned
# to 0.12 (hmac 0.12 / digest 0.10) to share `sha2 = 0.10` with the session-token
# digests — hkdf 0.13 pulls digest 0.11 and would fork the sha2 tree.
hkdf = "0.12.4"
# Scrubs plaintext key material from memory on drop. `derive` for ZeroizeOnDrop.
zeroize = { version = "1.9.0", features = ["derive"] }
# Only for cookie `Max-Age`: `cookie` 0.18 (via axum-extra) speaks time::Duration,
# not std::time::Duration. Cargo unifies this with axum-extra's own copy.
time = "0.3.53"
# GitHub REST client (Phase 12), confined behind Atlas's own `GitHostClient`
# trait so this is the only module that names it (docs/research/github-api.md).
# `rustls` rather than the OpenSSL default keeps the build free of a system TLS
# dependency; only api.github.com (a fixed host) is ever contacted.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "http2",
  "charset",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
garde = { version = "0.23.0", features = ["derive"] }
fractional_index = { version = "2.0.2", features = ["serde"] }
figment = { version = "0.10", features = ["env", "toml"] }
proptest = "1.8"
# System telemetry (CPU, memory, disk) for the admin settings page.
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }

# ---------------------------------------------------------------------------
# Lints. Inherited by members via `[lints] workspace = true`.
# Kept pragmatic: this must pass `cargo clippy --all-targets -- -D warnings`.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Deny the footguns that matter for a server that must not panic on user input.
unwrap_used = "warn"
# Noise from pedantic that costs more than it catches.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
